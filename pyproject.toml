[project]
name = "track-a-bike"
version = "0.1.0"
description = "Collect db carsharing bike data via the SOAP XML API, store it in Neo4j/SQL and visualize it"
requires-python = ">=3.10"
dependencies = [
    "lxml>=6.0.0",
    "matplotlib>=3.9.0",
    "neo4j>=5.0.0",
    "networkx>=3.0",
    "numpy>=2.0.0",
    "pydot>=3.0.0",
    "requests>=2.32.0",
    "sqlalchemy>=2.0.0",
]

[dependency-groups]
dev = []

[tool.uv]
package = false
